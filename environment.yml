# Environnement du Projet 4 (versions relevées dans l'env conda "CFD" existant, 2026-11-06).
# Recréer : conda env create -f environment.yml
name: CFD
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - numpy=2.5.4
  - scipy=1.18.1
  - numba=0.68.1
  - matplotlib=3.11.2
  - pandas=3.1.1
  - pytest=9.2.0
  - ipykernel=7.4.0
